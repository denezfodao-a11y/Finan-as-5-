<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinançApp Neon</title>
  
  <!-- Fontes e Ícones -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Chart.js & Tesseract OCR -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --accent-purple: #8b5cf6;
      --accent-pink: #ec4899;
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); display: flex; min-height: 100vh; overflow-x: hidden; }

    /* Menu Lateral */
    .sidebar {
      width: 260px; background: #0a0f1d; padding: 20px; display: flex; flex-direction: column; justify-content: space-between;
      transition: all 0.3s;
    }
    .brand { font-size: 1.5rem; font-weight: 700; color: var(--accent-pink); display: flex; align-items: center; gap: 10px; margin-bottom: 30px; }
    .menu-item { display: flex; align-items: center; gap: 12px; padding: 12px; color: var(--text-sub); text-decoration: none; border-radius: 10px; margin-bottom: 8px; transition: 0.2s; }
    .menu-item:hover, .menu-item.active { background: rgba(139, 92, 246, 0.2); color: var(--text-main); }
    
    .cycle-box { background: var(--bg-card); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); margin-top: auto; }
    .cycle-box h4 { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 8px; }
    .cycle-box input { width: 100%; background: var(--bg-main); border: 1px solid #334155; color: #fff; padding: 6px; border-radius: 6px; margin-bottom: 8px; }

    /* Conteúdo Principal */
    .main-content { flex: 1; padding: 30px; overflow-y: auto; }
    
    /* Indicadores / Cards */
    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .card { background: var(--bg-card); padding: 20px; border-radius: 16px; position: relative; overflow: hidden; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
    .card::before { content: ''; position: absolute; top: 0; left: 0; width: 6px; height: 100%; }
    .card.purple::before { background: var(--accent-purple); }
    .card.green::before { background: var(--accent-green); }
    .card.pink::before { background: var(--accent-pink); }
    .card-title { font-size: 0.9rem; color: var(--text-sub); margin-bottom: 8px; }
    .card-value { font-size: 1.8rem; font-weight: 700; }
    
    .edit-btn { background: none; border: none; color: var(--accent-blue); cursor: pointer; margin-left: 8px; font-size: 0.9rem; }

    /* Seções */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
    @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

    .panel { background: var(--bg-card); padding: 25px; border-radius: 16px; }
    .panel h3 { margin-bottom: 20px; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }

    /* Formulário */
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 5px; }
    .form-group input, .form-group select { width: 100%; padding: 12px; background: var(--bg-main); border: 1px solid #334155; border-radius: 8px; color: #fff; }
    
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .btn-primary { background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink)); color: white; }
    .btn-primary:hover { opacity: 0.9; }
    
    .camera-upload { border: 2px dashed var(--accent-purple); padding: 15px; border-radius: 8px; text-align: center; cursor: pointer; margin-bottom: 15px; background: rgba(139, 92, 246, 0.05); }

    /* Lista de Transações */
    .tx-list { list-style: none; max-height: 350px; overflow-y: auto; }
    .tx-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #334155; }
    .tx-info { display: flex; flex-direction: column; }
    .tx-title { font-weight: 600; font-size: 0.95rem; }
    .tx-date { font-size: 0.75rem; color: var(--text-sub); }
    .tx-amount { font-weight: 700; }
    .tx-amount.saida { color: var(--accent-pink); }
    .tx-amount.entrada { color: var(--accent-green); }

    #ocr-status { font-size: 0.8rem; color: var(--accent-blue); margin-top: 5px; display: none; }
  </style>
</head>
<body>

  <!-- Menu Lateral -->
  <aside class="sidebar">
    <div>
      <div class="brand"><i class="fa-solid fa-wallet"></i> FinançApp</div>
      <a href="#" class="menu-item active"><i class="fa-solid fa-chart-pie"></i> Painel</a>
      <a href="#" class="menu-item"><i class="fa-solid fa-list-check"></i> Extrato</a>
    </div>

    <!-- Ciclo Mensal -->
    <div class="cycle-box">
      <h4><i class="fa-regular fa-calendar-check"></i> Ciclo Mensal</h4>
      <label style="font-size: 0.7rem; color: var(--text-sub)">Início</label>
      <input type="date" id="cycle-start" value="2026-09-01">
      <label style="font-size: 0.7rem; color: var(--text-sub)">Fim</label>
      <input type="date" id="cycle-end" value="2026-09-30">
    </div>
  </aside>

  <!-- Conteúdo Principal -->
  <main class="main-content">
    
    <!-- Cards de Saldo -->
    <section class="dashboard-grid">
      <div class="card purple">
        <div class="card-title">Saldo Disponível (Editável) <button class="edit-btn" onclick="editarSaldo()"><i class="fa-solid fa-pen"></i></button></div>
        <div class="card-value" id="disp-val">R$ 0,00</div>
      </div>
      <div class="card green">
        <div class="card-title">Entradas no Ciclo</div>
        <div class="card-value" id="in-val">R$ 0,00</div>
      </div>
      <div class="card pink">
        <div class="card-title">Gastos no Ciclo</div>
        <div class="card-value" id="out-val">R$ 0,00</div>
      </div>
    </section>

    <!-- Formulário + Gráfico -->
    <section class="grid-2">
      
      <!-- Painel de Lançamento -->
      <div class="panel">
        <h3><i class="fa-solid fa-plus-circle"></i> Novo Lançamento</h3>
        
        <!-- Upload por Foto/Recibo -->
        <div class="camera-upload" onclick="document.getElementById('photo-input').click()">
          <i class="fa-solid fa-camera fa-2x" style="color: var(--accent-purple);"></i>
          <p style="font-size: 0.85rem; margin-top: 5px;">Tirar foto ou enviar recibo</p>
          <input type="file" id="photo-input" accept="image/*" capture="environment" style="display:none;" onchange="processarImagem(event)">
          <div id="ocr-status"><i class="fa-solid fa-spinner fa-spin"></i> Lendo valor da imagem...</div>
        </div>

        <form id="tx-form" onsubmit="adicionarLancamento(event)">
          <div class="form-group">
            <label>Descrição</label>
            <input type="text" id="desc" placeholder="Ex: Mercado, Salário..." required>
          </div>
          
          <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex: 1;">
              <label>Valor (R$)</label>
              <input type="number" step="0.01" id="amount" placeholder="0,00" required>
            </div>
            <div class="form-group" style="flex: 1;">
              <label>Tipo</label>
              <select id="type">
                <option value="saida">Gasto</option>
                <option value="entrada">Entrada</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>Categoria</label>
            <select id="category">
              <option value="Alimentação">Alimentação</option>
              <option value="Moradia">Moradia</option>
              <option value="Transporte">Transporte</option>
              <option value="Lazer">Lazer</option>
              <option value="Outros">Outros</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i> Salvar Lançamento</button>
        </form>
      </div>

      <!-- Gráfico de Gastos -->
      <div class="panel">
        <h3><i class="fa-solid fa-chart-donut"></i> Distribuição dos Gastos</h3>
        <div style="position: relative; height:250px;">
          <canvas id="expensesChart"></canvas>
        </div>
      </div>

    </section>

    <!-- Lista de Lançamentos Recentes -->
    <section class="panel">
      <h3><i class="fa-solid fa-history"></i> Histórico do Ciclo</h3>
      <ul class="tx-list" id="tx-list"></ul>
    </section>

  </main>

  <script>
    // Estado do App
    let saldoDisponivel = 5000;
    let lancamentos = [
      { id: 1, desc: 'Supermercado', amount: 350.50, type: 'saida', category: 'Alimentação', date: '2026-09-28 10:15:00' },
      { id: 2, desc: 'Freelance', amount: 1200.00, type: 'entrada', category: 'Outros', date: '2026-09-27 14:30:00' }
    ];

    let chartInstance = null;

    // Inicialização
    window.onload = () => {
      renderApp();
      initChart();
    };

    function editarSaldo() {
      const novoSaldo = prompt("Digite o novo valor disponível:", saldoDisponivel);
      if (novoSaldo !== null && !isNaN(parseFloat(novoSaldo))) {
        saldoDisponivel = parseFloat(novoSaldo);
        renderApp();
      }
    }

    function adicionarLancamento(e) {
      e.preventDefault();
      
      const desc = document.getElementById('desc').value;
      const amount = parseFloat(document.getElementById('amount').value);
      const type = document.getElementById('type').value;
      const category = document.getElementById('category').value;
      
      // Captura Data e Hora atual automaticamente
      const now = new Date();
      const dateStr = now.toISOString().slice(0, 10) + ' ' + now.toTimeString().slice(0, 8);

      lancamentos.unshift({ id: Date.now(), desc, amount, type, category, date: dateStr });
      
      // Ajusta o saldo disponível
      if (type === 'saida') saldoDisponivel -= amount;
      else saldoDisponivel += amount;

      document.getElementById('tx-form').reset();
      renderApp();
    }

    // Processamento de foto usando Tesseract.js (OCR)
    async function processarImagem(e) {
      const file = e.target.files[0];
      if (!file) return;

      const statusEl = document.getElementById('ocr-status');
      statusEl.style.display = 'block';

      try {
        const worker = await Tesseract.createWorker('por');
        const ret = await worker.recognize(file);
        await worker.terminate();

        // Expressão regular para tentar capturar valores no formato R$ 0,00 ou números
        const text = ret.data.text;
        const matches = text.match(/\d+[\.,]\d{2}/g);

        if (matches && matches.length > 0) {
          // Pega o maior número encontrado no cupom
          const nums = matches.map(n => parseFloat(n.replace(',', '.')));
          const maxVal = Math.max(...nums);
          document.getElementById('amount').value = maxVal;
          document.getElementById('desc').value = "Recibo Lido";
        } else {
          alert("Não foi possível identificar o valor automaticamente na imagem.");
        }
      } catch (err) {
        alert("Erro ao ler a imagem.");
      } finally {
        statusEl.style.display = 'none';
      }
    }

    function renderApp() {
      // Atualizar Saldo
      document.getElementById('disp-val').innerText = `R$ ${saldoDisponivel.toFixed(2)}`;

      // Filtrar pelo Ciclo Mensal
      const startDate = document.getElementById('cycle-start').value;
      const endDate = document.getElementById('cycle-end').value;

      const txFiltradas = lancamentos.filter(tx => {
        const txDate = tx.date.slice(0, 10);
        return txDate >= startDate && txDate <= endDate;
      });

      let totalIn = 0;
      let totalOut = 0;
      const categoryTotals = {};

      const listEl = document.getElementById('tx-list');
      listEl.innerHTML = '';

      txFiltradas.forEach(tx => {
        if (tx.type === 'entrada') {
          totalIn += tx.amount;
        } else {
          totalOut += tx.amount;
          categoryTotals[tx.category] = (categoryTotals[tx.category] || 0) + tx.amount;
        }

        // Renderizar Lista
        const li = document.createElement('li');
        li.className = 'tx-item';
        li.innerHTML = `
          <div class="tx-info">
            <span class="tx-title">${tx.desc} <small style="color:var(--text-sub)">(${tx.category})</small></span>
            <span class="tx-date">${tx.date}</span>
          </div>
          <span class="tx-amount ${tx.type}">${tx.type === 'entrada' ? '+' : '-'} R$ ${tx.amount.toFixed(2)}</span>
        `;
        listEl.appendChild(li);
      });

      document.getElementById('in-val').innerText = `R$ ${totalIn.toFixed(2)}`;
      document.getElementById('out-val').innerText = `R$ ${totalOut.toFixed(2)}`;

      updateChart(categoryTotals);
    }

    function initChart() {
      const ctx = document.getElementById('expensesChart').getContext('2d');
      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: [],
          datasets: [{
            data: [],
            backgroundColor: ['#ec4899', '#8b5cf6', '#3b82f6', '#10b981', '#f59e0b'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { color: '#f8fafc' } } }
        }
      });
    }

    function updateChart(categoryTotals) {
      if (!chartInstance) return;
      chartInstance.data.labels = Object.keys(categoryTotals);
      chartInstance.data.datasets[0].data = Object.values(categoryTotals);
      chartInstance.update();
    }
  </script>
</body>
</html>
